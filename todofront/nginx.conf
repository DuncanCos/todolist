server {
    listen 80;
    server_name localhost;

    # Dossier où se trouvent les fichiers du build Vite
    root /usr/share/nginx/html;
    index index.html;

    # Gestion de la compression Gzip (optionnel mais recommandé pour la perf)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # IMPORTANT : Si le fichier demandé n'existe pas ($uri),
        # on renvoie vers index.html pour que le routeur JS (React/Vue Router) prenne le relais.
        try_files $uri $uri/ /index.html;
    }

    # Optionnel : Cache long pour les assets statiques (images, css, js)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Gestion des erreurs 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}